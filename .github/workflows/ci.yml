name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Scan for committed secrets
        # Fails the build if anything that looks like an API key is committed.
        run: |
          if git grep -nIE '(sk-[A-Za-z0-9_-]{20,}|voc-[0-9a-f]{20,}|sk-ant-[A-Za-z0-9_-]{20,})' -- . ':!package-lock.json'; then
            echo "::error::Possible API key committed. Remove it, rotate the key and use environment variables."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        # No API key is needed to build; the key is only read at request time.
